[project]
name = "biliyt"
version = "0.1.0"
description = "Bilibili & YouTube creator archiver CLI: incremental video/subtitle sync, full dynamics/articles/curated comments archive, and SQLite FTS5 search."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "chosenecho" },
]
keywords = ["bilibili", "youtube", "yt-dlp", "archiver", "cli", "sqlite", "fts5"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Archiving",
]
requires-python = ">=3.11"
dependencies = [
    "yt-dlp[default,curl-cffi]>=2026.1.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.urls]
Homepage = "https://github.com/chosenecho/biliyt-archiver"
Repository = "https://github.com/chosenecho/biliyt-archiver"
Issues = "https://github.com/chosenecho/biliyt-archiver/issues"
Changelog = "https://github.com/chosenecho/biliyt-archiver/blob/main/CHANGELOG.md"

[project.scripts]
biliyt = "biliyt.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biliyt"]

[tool.hatch.build.targets.wheel.force-include]
"config.example.yaml" = "biliyt/config.example.yaml"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/config.example.yaml",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

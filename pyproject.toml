[project]
name = "biliyt"
version = "0.1.0"
description = "基于 yt-dlp 的 Bilibili / YouTube 目标用户批量增量下载工作流"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp[default,curl-cffi]>=2026.1.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.scripts]
biliyt = "biliyt.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biliyt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

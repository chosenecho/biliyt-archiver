name: Feature Request
description: 提出新功能建议、配置项需求或体验改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的使用场景或痛点
      description: 描述你当前归档工作流中遇到的具体限制。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 描述你期望的 CLI 参数、config.yaml 字段或产物格式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑过的替代方案（可选）
      description: 是否有其他工具或变通方式，以及为什么不够理想。
